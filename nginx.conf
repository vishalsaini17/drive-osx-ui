# Behind Caddy (docker-compose.proxy.yml) this container only ever sees plain
# HTTP, so $scheme is always "http" even for a request that was https all the
# way from the browser to Caddy. Trust Caddy's X-Forwarded-Proto when present;
# otherwise (bare-IP mode, docker-compose.yml alone, nothing in front) fall
# back to this connection's own scheme.
map $http_x_forwarded_proto $proxied_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker embedded DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # In the proxy deployment, Caddy is the only thing that ever talks to
    # this container, over the internal compose network — recover the real
    # client IP from the header it set rather than $remote_addr (which would
    # otherwise just be Caddy's container IP). Harmless in bare-IP mode: with
    # nothing in front, there's no X-Forwarded-For to trust in the first place.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        set $api_upstream drive-osx-api;
        proxy_pass http://$api_upstream:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_scheme;
        # Uploads stream through here; the API enforces its own size limit.
        client_max_body_size 128m;
        proxy_read_timeout 300s;
    }

    # Realtime gateway (meeting signalling, notification delivery).
    location /ws {
        set $ws_upstream drive-osx-api;
        proxy_pass http://$ws_upstream:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The service worker must never be served stale, or the shell can be
    # pinned to an old build.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
